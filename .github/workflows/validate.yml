name: Validate skills and tools

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: skills/score-verify/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install alphaTab
        run: npm --prefix skills/score-verify ci
      - name: Check skill packaging
        run: python tools/check_repository.py
      - name: Test Python utilities
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Test alphaTab workflow
        run: node --test tests/test_alphatab.cjs
